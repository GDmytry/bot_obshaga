services:
  db:
    image: postgres:15-alpine
    container_name: smartdorm_db
    environment:
      POSTGRES_USER: ${DB_USER:-smartdorm}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartdorm_super_secret_password}
      POSTGRES_DB: ${DB_NAME:-smartdorm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

  bot:
    build: .
    container_name: smartdorm_bot
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-smartdorm}
      - DB_PASSWORD=${DB_PASSWORD:-smartdorm_super_secret_password}
      - DB_NAME=${DB_NAME:-smartdorm}
      - DEV_MODE=0
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    depends_on:
      - db
      - vpn-client
    restart: unless-stopped

  vpn-client:
    image: mzz2017/v2raya
    container_name: smartdorm_vpn
    restart: unless-stopped
    privileged: true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "2017:2017"   # Web-интерфейс v2rayA
      - "20170:20170" # SOCKS5 прокси
      - "20171:20171" # HTTP прокси
    environment:
      - V2RAYA_LOG_FILE=/tmp/v2raya.log
    volumes:
      - /etc/v2raya:/etc/v2raya

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: smartdorm_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.3
    container_name: smartdorm_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
